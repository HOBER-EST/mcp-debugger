    <text x="453" y="288" text-anchor="middle" font-size="20" font-weight="400" fill="#484f58">→</text>

    <g transform="translate(548, 285)">
      <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle">DIAGNOSE</text>
    </g>

    <text x="623" y="288" text-anchor="middle" font-size="20" font-weight="400" fill="#484f58">→</text>

    <g transform="translate(708, 285)">
      <rect x="-35" y="-18" width="70" height="36" rx="18" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle">FIX</text>
    </g>

    <text x="763" y="288" text-anchor="middle" font-size="20" font-weight="400" fill="#484f58">→</text>

    <g transform="translate(848, 285)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle">VERIFY</text>
    </g>
  </g>

  <!-- footer stats -->
  <text x="640" y="362" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8b949e">10 failure patterns · bilingual docs · examples included · zero dependencies</text>
